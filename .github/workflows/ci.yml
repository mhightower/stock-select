name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Unit tests only (mvn test) — no API keys needed. Integration tests
      # (mvn verify) hit the real EODHD/MarketData.app APIs and are run
      # manually/locally so CI doesn't burn the free-tier daily quota.
      - name: Run unit tests
        run: ./mvnw test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
