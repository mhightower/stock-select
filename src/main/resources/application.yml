server:
  port: 8080

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      # Exposes health at /health instead of the default /actuator/health.
      base-path: /
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false

eodhd:
  base-url: https://eodhd.com
  api-key: ${EODHD_API_KEY:demo}

marketdata:
  base-url: https://api.marketdata.app
  api-key: ${MARKETDATA_API_KEY:}

strategy:
  jade-lizard:
    # Target days-to-expiration window for the chosen contract.
    target-dte: 45
    min-dte: 30
    max-dte: 60
    # Absolute delta each short leg should be closest to.
    short-call-target-delta: 0.16
    short-put-target-delta: 0.16
    # Standard Jade Lizard construction rule: total credit must be at least
    # this multiple of the put spread width to keep the trade's risk profile intact.
    min-credit-to-width-ratio: 1.0
  bull-put-spread:
    # Target days-to-expiration window for the chosen contract.
    target-dte: 45
    min-dte: 30
    max-dte: 60
    # Absolute delta the short put should be closest to.
    short-put-target-delta: 0.30
    # Standard vertical-spread guideline: aim to collect at least a third of the width as credit.
    min-credit-to-width-ratio: 0.33

logging:
  level:
    com.stockselect: INFO
