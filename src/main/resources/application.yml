server:
  port: 8080

spring:
  application:
    name: stock-select
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      # Exposes health at /health instead of the default /actuator/health; the rest of the
      # ops surface (metrics, prometheus, info) stays under /actuator to keep it separate
      # from both /health and the app's own /api/* routes.
      base-path: /
      exposure:
        include: health, prometheus, metrics, info
      path-mapping:
        prometheus: actuator/prometheus
        metrics: actuator/metrics
        info: actuator/info
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

eodhd:
  base-url: https://eodhd.com
  api-key: ${EODHD_API_KEY:demo}

marketdata:
  base-url: https://api.marketdata.app
  api-key: ${MARKETDATA_API_KEY:}

strategy:
  jade-lizard:
    # Target days-to-expiration window for the chosen contract.
    target-dte: 45
    min-dte: 30
    max-dte: 60
    # Absolute delta each short leg should be closest to.
    short-call-target-delta: 0.16
    short-put-target-delta: 0.16
    # Standard Jade Lizard construction rule: total credit must be at least
    # this multiple of the put spread width to keep the trade's risk profile intact.
    min-credit-to-width-ratio: 1.0
    # Liquidity gate: reject contracts with too little open interest, or a bid-ask
    # spread too wide (as a fraction of the mid) to realistically fill at a fair price.
    min-open-interest: 10
    max-bid-ask-spread-ratio: 0.20
  bull-put-spread:
    # Target days-to-expiration window for the chosen contract.
    target-dte: 45
    min-dte: 30
    max-dte: 60
    # Absolute delta the short put should be closest to.
    short-put-target-delta: 0.30
    # Standard vertical-spread guideline: aim to collect at least a third of the width as credit.
    min-credit-to-width-ratio: 0.33
    # Liquidity gate: reject contracts with too little open interest, or a bid-ask
    # spread too wide (as a fraction of the mid) to realistically fill at a fair price.
    min-open-interest: 10
    max-bid-ask-spread-ratio: 0.20
  bear-call-spread:
    # Target days-to-expiration window for the chosen contract.
    target-dte: 45
    min-dte: 30
    max-dte: 60
    # Absolute delta the short call should be closest to.
    short-call-target-delta: 0.30
    # Standard vertical-spread guideline: aim to collect at least a third of the width as credit.
    min-credit-to-width-ratio: 0.33
    # Liquidity gate: reject contracts with too little open interest, or a bid-ask
    # spread too wide (as a fraction of the mid) to realistically fill at a fair price.
    min-open-interest: 10
    max-bid-ask-spread-ratio: 0.20

logging:
  level:
    '[com.stockselect]': INFO
  pattern:
    # %kvp renders the SLF4J fluent addKeyValue() fields added in later tasks (strategy,
    # symbol, vendor, status, latencyMs) — silently dropped by Boot's default colored
    # pattern otherwise. ANSI color codes are dropped in the process, which is fine for
    # containerized log output that usually gets stripped/reformatted by a log collector.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m %kvp%n"
